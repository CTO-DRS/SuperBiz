# أُزيل org.gradle.java.home المثبّت على مسار JDK خاص بجهاز واحد —
# كان يفشل البناء على أي جهاز آخر برسالة "Java home supplied is invalid".
# يستخدم Gradle الآن JAVA_HOME النظامي (يتطلب JDK 17+).
org.gradle.jvmargs=-Xmx2304m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
# [P32-FIX] كانت -Xmx1024m فتنهار codegen الدوال القابلة للتركيب الكبيرة بـOutOfMemoryError
# في FixStackMethodTransformer (CI حمراء منذ موجة P20 على كل الدفعات) — 3g آمنة على
# المستضيف (7GB) وعلى أجهزة التطوير الحديثة، وتُبقي gradle JVM عند 2304m.
kotlin.daemon.jvmargs=-Xmx3g
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# JDK كامل (به jlink/javac) داخل المشروع — بيئة الحاوية تزوّد JRE فقط
