name: ci

# [E1.2 V 3.4.0] بوابة الجناح على كل PR — الجناح الكامل + بوابات الجودة الأربع
# + lint بتحليل حقيقي. الأحمر يمنع الدمج (فرع الحماية على main يفرض هذا الـworkflow).
# بلا أسرار هنا حصراً — هذا الـworkflow لا يوقّع ولا ينشر.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ review/** ]

jobs:
  suite:
    name: unit suite + quality gates + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin, pinned like the local toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
          cache: gradle

      - name: Quality gates (4) + self-tests
        run: |
          set -e
          python3 tools/check_strings.py --self-test
          python3 tools/check_strings.py
          python3 tools/check_strings_format.py --self-test
          python3 tools/check_strings_format.py
          python3 tools/check_locale_coverage.py --self-test
          python3 tools/check_locale_coverage.py
          python3 tools/check_network_boundary.py --self-test
          python3 tools/check_network_boundary.py

      - name: Performance budgets (5th gate — enforces when device results are attached)
        run: |
          python3 tools/check_perf_budgets.py --self-test
          # PR مسار بلا جهاز: وضع NOT-VERIFIED الصادق؛ إن رُفق تقرير جهاز فالبوابة تُفرض
          if [ -f benchmark-results.json ]; then
            python3 tools/check_perf_budgets.py --results benchmark-results.json
          else
            python3 tools/check_perf_budgets.py
          fi

      - name: Unit suite (full, forced)
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Lint (release, fresh analysis)
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Assemble debug (identity gate — versioning must match the branch tip)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
