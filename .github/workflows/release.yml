name: release

# [E1.2 V 3.4.0] مسار الإصدار على tag v* — يبني الحزمة ويطبع SHA-256 ويرفقها
# للتنفيذ. التوقيع: إذا وُجد سر keys.SIGNING_KEYSTORE فتُوقَّع الحزمة به
# (بصيغة keystore.properties المؤقتة — نفس عقد build.gradle.kts)، وإلا تُرفع
# حزمة غير موقعة مع تحذير صريح — لا توقيع وهمي أبداً (E0.1 بيد المالك حتى الآن).

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: signed (or explicitly unsigned) release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin, pinned like the local toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.13+11'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing material when provided
        id: signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > keystore.jks
            cat > keystore.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          storePassword=$SIGNING_KEYSTORE_PASS
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASS
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secret present — artifact ships UNSIGNED (E0.1 keystore ceremony pending)"
          fi

      - name: Build release bundle + APK
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify identity (aapt) and print SHA-256
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -1
          echo "SHA-256 ($(basename $APK)):"
          sha256sum "$APK" | tee "${APK}.sha256"
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] && sha256sum "$AAB" | tee "${AAB}.sha256"

      - name: Attach artifacts to the run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
